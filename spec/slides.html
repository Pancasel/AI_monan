# 🥗 AI Món Ăn
## Trợ Lý Dị Ứng Cá Nhân

**Nhóm:** Day06-[Tên Lớp]-Nhom[XX]
**Track:** Food & Local Delivery

---

## 1. Vấn đề (Nỗi đau người dùng) 😢

- **Khó khăn:** Đi ăn ngoài luôn là "cơn ác mộng" với người bị dị ứng (lạc, hải sản) hoặc người ăn kiêng nghiêm ngặt.
- **Thực trạng:** 
  - Đọc menu mệt mỏi, không rõ thành phần ẩn (nước dùng, mắm).
  - Các App như ShopeeFood, GrabFood <span class="highlight">chưa cho phép lọc quán ăn theo hồ sơ sức khoẻ</span>.
- **Hệ quả:** Tâm lý bất an, mất nhiều thời gian chọn quán, dễ ăn nhầm gây nguy hiểm (sốc phản vệ).

---

## 2. Giải pháp của chúng tôi 💡

Một **Bản đồ Ẩm thực thông minh** tích hợp AI làm nhiệm vụ sàng lọc:

- **Bước 1:** Khai báo hồ sơ dị ứng một lần duy nhất.
- **Bước 2:** AI tự động quét menu của 30+ nhà hàng.
- **Bước 3:** Gắn nhãn màu trực tiếp lên từng món ăn để giúp bạn ra quyết định chỉ trong vài giây.

---

## 3. AI Product Canvas 🧠

| Yếu tố | Diễn giải |
| :--- | :--- |
| **Giá trị** | AI đọc và hiểu hàng trăm món ăn siêu tốc. Giảm thời gian tìm kiếm từ 15 phút xuống 5 giây. |
| **Niềm tin** | Phương châm: *"Thà giết lầm hơn bỏ sót"*. AI nếu không chắc chắn 100% sẽ yêu cầu con người check lại. |
| **Khả thi** | Có thể làm được vì LLMs rất giỏi suy luận ngữ cảnh (VD: hiểu món Bún chả thường ăn với mắm). |
| **Tín hiệu học** | Lưu trữ kết quả khi nhà hàng xác nhận lại món ăn để cập nhật bộ luật cho những người dùng sau. |

---

## 4. Tăng Năng Lực (Augment) ⚖️

Tại sao chúng tôi **không Tự động hóa hoàn toàn**?

- Rủi ro về sức khỏe là <span class="highlight">không thể chấp nhận được</span>. Không thể phó mặc tính mạng người dùng cho AI.
- AI ở đây đóng vai trò là "Bộ lọc thô", giúp **thu hẹp phạm vi**.
- Quyết định cuối cùng và thao tác hỏi nhà hàng (khi gặp món nghi ngờ) vẫn **hoàn toàn nằm trong tay con người**.

---

## 5. Hệ thống 3 Nhãn Màu 🚦

- <span class="safe">🟢 Nhãn Xanh (An toàn):</span> AI tự tin món này an toàn.
- <span class="danger">🔴 Nhãn Đỏ (Nguy hiểm):</span> Chắc chắn có thành phần dị ứng.
- <span class="warning">🟡 Nhãn Vàng (Nghi ngờ):</span> Món ăn có thành phần ẩn. Buộc người dùng bấm **[Hỏi nhà hàng]**.

<br>

=> **Vòng lặp:** Nhà hàng xác nhận món Vàng -> Chuyển thành Xanh/Đỏ -> **Hệ thống học và ghi nhớ**.

---

## 6. Kịch bản Live Demo 🎬

**Khách hàng:** Dị ứng **Đậu phộng** & **Hải sản**.

1. **Đường thuận:** Quét menu quán "Phở Bò". AI đánh dấu Xanh các món bò -> Chốt đơn.
2. **Đường không chắc chắn:** Quét menu có món "Gỏi cuốn". AI đánh dấu Vàng do nghi ngờ phần nước chấm. Khách ấn nút nhờ Đầu Bếp xác nhận lại không bỏ lạc -> Món chuyển màu Xanh.
